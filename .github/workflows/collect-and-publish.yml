name: Collect downloads and publish

on:
  push:
    branches: [main]
  schedule:
    # 03:17 in Israel during daylight-saving time; the exact minute is
    # intentionally uncommon to avoid the busiest part of the hour.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: otzaria-download-tracker-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the current branch tip
        uses: actions/checkout@v7
        with:
          # Re-runs retain the original event SHA, even after the first
          # attempt has committed data. Collect and publish from the current
          # branch tip instead of recreating an obsolete snapshot.
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect a daily snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. GitHub keeps traffic for 14 days only and serves it only
          # to tokens with push access to each repository in TRAFFIC_REPOSITORIES.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 scripts/collect_downloads.py

      - name: Commit new data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/data archive
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: collect daily download snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # Keep .nojekyll and other hidden site files, as in v3.
          include-hidden-files: true
          # A re-run shares the run ID with earlier attempts. Give each
          # attempt its own name so it cannot reuse or collide with old data.
          name: github-pages-${{ github.run_attempt }}

      # deploy-pages lists artifacts through the internal Actions artifact
      # service, where a just-uploaded artifact may not be visible yet.
      # Probe that same service (no github-token or run-id override) using
      # the exact upload ID. Retry only the probe, not the deployment.
      - name: Check upload returned an artifact ID
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return a valid artifact ID."
            exit 1
          fi

      - name: Check Pages artifact availability
        id: pages_probe
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-probe

      - name: Wait before retrying artifact lookup
        if: steps.pages_probe.outcome == 'failure'
        run: sleep 10

      - name: Retry Pages artifact availability
        id: pages_probe_retry
        if: steps.pages_probe.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-probe

      - name: Wait before final artifact lookup
        if: steps.pages_probe_retry.outcome == 'failure'
        run: sleep 30

      - name: Final Pages artifact availability check
        if: steps.pages_probe_retry.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-probe

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

